<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #16181d;
    --muted: #4a4f5a;
    --accent: #1451b4;
    --accent-fg: #ffffff;
    --rule: #c9ced8;
    --panel: #f1f3f7;
    --code-bg: #eceff4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1116;
      --fg: #eceff4;
      --muted: #b3bac6;
      --accent: #7ab5ff;
      --accent-fg: #0f1116;
      --rule: #3a4150;
      --panel: #191d25;
      --code-bg: #232833;
    }
  }

  html {
    font-size: 112.5%;
    /* Painted on <html> as well as <body> so the gutters either side of the
       centred column match the page rather than showing the UA canvas. */
    background: var(--bg);
    color: var(--fg);
  }
  body {
    margin: 0 auto;
    padding: 2rem 1.25rem 6rem;
    max-width: 46rem;
    background: var(--bg);
    color: var(--fg);
    font-family:
      system-ui,
      -apple-system,
      "Segoe UI",
      Roboto,
      sans-serif;
    line-height: 1.65;
    overflow-wrap: break-word;
  }

  a {
    color: var(--accent);
  }
  a:focus-visible,
  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: 2px;
  }

  header#title-block-header {
    border-bottom: 2px solid var(--rule);
    padding-bottom: 1rem;
    margin-bottom: 1.5rem;
  }
  h1.title {
    font-size: 1.9rem;
    line-height: 1.25;
    margin: 0 0 0.35rem;
  }
  p.subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 1.05rem;
    font-weight: 400;
  }

  h1,
  h2,
  h3 {
    line-height: 1.25;
    margin: 2.25rem 0 0.75rem;
  }
  h1 {
    font-size: 1.6rem;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.35rem;
  }
  h2 {
    font-size: 1.25rem;
  }
  h3 {
    font-size: 1.08rem;
  }

  nav#TOC {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 0.6rem;
    padding: 1rem 1.25rem;
    margin-bottom: 2rem;
  }
  nav#TOC h2 {
    margin-top: 0;
    font-size: 1.1rem;
  }
  nav#TOC ul {
    padding-left: 1.2rem;
    margin-bottom: 0;
  }
  nav#TOC li {
    margin: 0.2rem 0;
  }

  .manual-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.25rem;
    align-items: baseline;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.9rem;
    margin-bottom: 1.5rem;
    font-size: 0.95rem;
  }
  .manual-nav strong {
    font-weight: 600;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    margin: 1rem 0 1.5rem;
    font-size: 0.98rem;
  }
  caption {
    text-align: left;
    color: var(--muted);
    padding-bottom: 0.35rem;
  }
  th,
  td {
    border: 1px solid var(--rule);
    padding: 0.5rem 0.65rem;
    text-align: left;
    vertical-align: top;
  }
  thead th {
    background: var(--panel);
  }
  tbody tr:nth-child(even) td {
    background: color-mix(in srgb, var(--panel) 55%, transparent);
  }
  code {
    background: var(--code-bg);
    padding: 0.1em 0.35em;
    border-radius: 0.25rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.92em;
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--rule);
    border-radius: 0.5rem;
    padding: 0.85rem 1rem;
    overflow-x: auto;
  }
  pre code {
    background: none;
    padding: 0;
  }

  blockquote {
    margin: 1rem 0;
    padding: 0.5rem 1rem;
    border-left: 4px solid var(--accent);
    background: var(--panel);
    color: var(--fg);
  }
  blockquote p {
    margin: 0.25rem 0;
  }

  hr {
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 2.5rem 0;
  }

  ol,
  ul {
    padding-left: 1.4rem;
  }
  li {
    margin: 0.3rem 0;
  }

  @media print {
    body {
      max-width: none;
    }
    nav#TOC,
    .manual-nav {
      display: none;
    }
  }
</style>
